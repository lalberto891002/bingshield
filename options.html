<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configuración · Guardia Web</title><link rel="stylesheet" href="options.css"></head><body><main><h1>Guardia Web</h1><section><h2>Reglas de bloqueo</h2><form id="rule-form"><input id="pattern" placeholder="ejemplo.com o *social*" required><button>Añadir</button></form><ul id="rules"></ul></section><section><h2>Horario global</h2><label><input type="checkbox" id="schedule-enabled"> Activar horario</label><div class="row"><label>Días <select id="days" multiple size="7"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></label><label>Desde <input type="time" id="start"></label><label>Hasta <input type="time" id="end"></label></div></section><section><h2>Control parental</h2><p id="pin-state"></p><form id="pin-form"><input id="pin" type="password" inputmode="numeric" minlength="4" maxlength="32" placeholder="PIN de 4 o más caracteres" required><button>Establecer o cambiar PIN</button></form><label><input type="checkbox" id="notifications"> Notificar cada bloqueo</label></section><section><h2>Historial</h2><button id="clear-history" class="secondary">Borrar historial</button><ul id="history"></ul></section><section><h2>Copias</h2><button id="export" class="secondary">Exportar configuración</button><label class="file">Importar configuración <input id="import" type="file" accept="application/json"></label></section><p id="message" role="status"></p></main><script src="shared.js"></script><script src="options.js"></script></body></html>
