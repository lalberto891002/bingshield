<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configuración · BingeBlock</title><link rel="stylesheet" href="options.css"></head><body><main><h1>BingeBlock</h1><section><h2 data-i18n="rulesTitle"></h2><form id="rule-form"><input id="pattern" data-i18n-placeholder="rulePlaceholder" required><button data-i18n="add"></button></form><ul id="rules"></ul></section><section><h2 data-i18n="scheduleTitle"></h2><label><input type="checkbox" id="schedule-enabled"> <span data-i18n="enableSchedule"></span></label><div class="row"><label><span data-i18n="days"></span> <select id="days" multiple size="7"><option value="1" data-day="monday">Lunes</option><option value="2" data-day="tuesday">Martes</option><option value="3" data-day="wednesday">Miércoles</option><option value="4" data-day="thursday">Jueves</option><option value="5" data-day="friday">Viernes</option><option value="6" data-day="saturday">Sábado</option><option value="0" data-day="sunday">Domingo</option></select></label><label>Desde <input type="time" id="start"></label><label>Hasta <input type="time" id="end"></label></div></section><section><h2 data-i18n="parentalTitle"></h2><p id="pin-state"></p><form id="pin-form"><input id="pin" type="password" inputmode="numeric" minlength="4" maxlength="32" data-i18n-placeholder="pinPlaceholder" required><button data-i18n="changePin"></button></form><label><input type="checkbox" id="notifications"> <span data-i18n="notifyEach"></span></label></section><section><h2 data-i18n="historyTitle"></h2><button id="clear-history" class="secondary" data-i18n="clearHistory"></button><ul id="history"></ul></section><section><h2 data-i18n="backupsTitle"></h2><button id="export" class="secondary" data-i18n="export"></button><label class="file"><span data-i18n="import"></span> <input id="import" type="file" accept="application/json"></label></section><p id="message" role="status"></p></main><script src="shared.js"></script><script src="options.js"></script></body></html>
